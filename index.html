<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audit Summary Report</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @page { size: Letter; margin: 0.6in 0.7in 0.7in; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ecf1; font-family: Arial, Calibri, sans-serif; color: #222; font-size: 10pt; }
  .toolbar { position: sticky; top: 0; z-index: 5; background: #1f3a5f; padding: 10px; text-align: center; }
  .toolbar button { font: bold 13px Arial; margin: 0 4px; padding: 8px 16px; border: 0; border-radius: 4px; background: #fff; color: #1f3a5f; cursor: pointer; }
  .toolbar button:hover { background: #d9e2f3; }
  .page { width: 8.5in; height: 11in; margin: 20px auto; background: #fff; padding: 0.6in 0.7in 0.7in; box-shadow: 0 2px 10px rgba(0,0,0,.2); overflow: hidden; display: flex; flex-direction: column; }
  .banner { background: #1f3a5f; color: #fff; padding: 8px 12px; }
  .banner h1 { margin: 0; font-size: 18pt; }
  .banner div { font-size: 9pt; color: #d9e2f3; }
  table.meta { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .meta td { border: 1px solid #bfbfbf; padding: 7px 8px; font-size: 9.5pt; height: 0.36in; }
  .meta td.l { background: #e7ecf4; color: #1f3a5f; font-weight: bold; font-size: 9pt; width: 17%; }
  .meta td.v { background: #f7f7f7; }
  h2 { font-size: 10.5pt; color: #1f3a5f; text-transform: uppercase; margin: 14px 0 5px; padding-bottom: 2px; border-bottom: 2px solid #1f3a5f; }
  [contenteditable]:focus { outline: 2px solid #8496b0; }
  [data-ph]:empty:before { content: attr(data-ph); color: #7f7f7f; }
  #evidence { height: 4.3in; flex: none; border: 2px dashed #8496b0; background: #fafbfd; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
  #evidence .hint { font-weight: bold; font-size: 12pt; color: #8a99ae; padding: 10px; }
  #evidence img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #remarks { flex: 1; min-height: 1in; border: 1px solid #1f3a5f; padding: 8px 10px; overflow: hidden; white-space: pre-wrap; }
  #remarks:empty:before { font-style: italic; }
  footer { margin-top: 8px; border-top: 1px solid #bfbfbf; padding-top: 4px; font-size: 8pt; color: #7f7f7f; display: flex; justify-content: space-between; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .page { margin: 0; box-shadow: none; width: auto; height: 9.65in; padding: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">Save as PDF / Print</button>
  <button onclick="downloadWord()">Download Word (.doc)</button>
  <button onclick="clearEvidence()">Clear image</button>
</div>

<div class="page">
  <div class="banner"><h1>AUDIT SUMMARY REPORT</h1><div>Internal Audit &nbsp;|&nbsp; Evidence &amp; Findings Record</div></div>

  <table class="meta">
    <tr>
      <td class="l">Audit Project / Title</td><td class="v" contenteditable data-ph="[ Enter audit title ]"></td>
      <td class="l">Auditor Name</td><td class="v" contenteditable data-ph="[ Enter name ]"></td>
    </tr>
    <tr>
      <td class="l">Date &amp; Time</td><td class="v" contenteditable data-ph="[ DD/MM/YYYY  HH:MM ]"></td>
      <td class="l">Status</td>
      <td class="v"><select style="font:inherit;border:0;background:transparent;width:100%">
        <option>[ Pass ]  [ Fail ]  [ Needs Review ]</option>
        <option>[ Pass ]</option><option>[ Fail ]</option><option>[ Needs Review ]</option>
      </select></td>
    </tr>
  </table>

  <h2>Audit Evidence / Visual Proof</h2>
  <div id="evidence"><span class="hint">[ CLICK HERE AND PASTE SCREENSHOT / SNIP IMAGE ]</span></div>

  <h2>Audit Findings &amp; Final Remarks</h2>
  <div id="remarks" contenteditable data-ph="[ Enter summary, audit observations, and action items here... ]"></div>

  <footer><span>Confidential — Internal Audit Use Only</span><span>Page 1</span></footer>
</div>

<script>
  const ev = document.getElementById('evidence');
  const hint = '<span class="hint">[ CLICK HERE AND PASTE SCREENSHOT / SNIP IMAGE ]</span>';

  function showImage(file) {
    const r = new FileReader();
    r.onload = () => { ev.innerHTML = '<img alt="Audit evidence" src="' + r.result + '">'; };
    r.readAsDataURL(file);
  }
  function clearEvidence() { ev.innerHTML = hint; }

  // Ctrl+V / Cmd+V anywhere on the page pastes an image into the evidence box
  document.addEventListener('paste', e => {
    const items = (e.clipboardData || {}).items || [];
    for (const it of items) {
      if (it.type.startsWith('image/')) { e.preventDefault(); showImage(it.getAsFile()); return; }
    }
    if (e.target.isContentEditable) {   // keep text pastes plain
      e.preventDefault();
      document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
    }
  });
  // Drag & drop, or double-click to browse for a file
  ev.addEventListener('dragover', e => e.preventDefault());
  ev.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) showImage(f);
  });
  ev.addEventListener('dblclick', () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => i.files[0] && showImage(i.files[0]); i.click();
  });

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function downloadWord() {
    const cells = [...document.querySelectorAll('.meta td.v')].map(c => {
      const s = c.querySelector('select');
      return esc(s ? s.value : c.textContent.trim()) || '&nbsp;';
    });
    const img = ev.querySelector('img');
    const remarks = esc(document.getElementById('remarks').innerText.trim() ||
      '[ Enter summary, audit observations, and action items here... ]').replace(/\n/g, '<br>');
    const lab = (t, v) => '<td style="background:#e7ecf4;border:1px solid #bfbfbf;padding:6px;font-weight:bold;color:#1f3a5f;width:17%">' + t +
      '</td><td style="background:#f7f7f7;border:1px solid #bfbfbf;padding:6px">' + v + '</td>';
    const h2 = t => '<p style="font-size:10.5pt;font-weight:bold;color:#1f3a5f;border-bottom:2px solid #1f3a5f;margin:12pt 0 4pt">' + t + '</p>';
    const evBody = img ? '<img src="' + img.src + '" style="max-width:6.6in;max-height:4.2in">'
                       : '[ CLICK HERE AND PASTE SCREENSHOT / SNIP IMAGE ]';
    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Audit Summary</title>' +
      '<style>@page{size:8.5in 11in;margin:0.6in 0.7in 0.7in} body{font-family:Arial;font-size:10pt} td{font-family:Arial;font-size:9.5pt}</style></head><body>' +
      '<table width="100%" style="border-collapse:collapse"><tr><td style="background:#1f3a5f;color:#fff;padding:8px"><b style="font-size:18pt">AUDIT SUMMARY REPORT</b><br><span style="font-size:9pt;color:#d9e2f3">Internal Audit | Evidence &amp; Findings Record</span></td></tr></table><br>' +
      '<table width="100%" style="border-collapse:collapse"><tr>' + lab('Audit Project / Title', cells[0]) + lab('Auditor Name', cells[1]) + '</tr><tr>' +
      lab('Date &amp; Time', cells[2]) + lab('Status', cells[3]) + '</tr></table>' +
      h2('AUDIT EVIDENCE / VISUAL PROOF') +
      '<table width="100%" style="border-collapse:collapse"><tr><td align="center" height="380" style="border:2px dashed #8496b0;background:#fafbfd;color:#8a99ae;font-weight:bold">' + evBody + '</td></tr></table>' +
      h2('AUDIT FINDINGS &amp; FINAL REMARKS') +
      '<table width="100%" style="border-collapse:collapse"><tr><td height="150" valign="top" style="border:1px solid #1f3a5f;padding:8px">' + remarks + '</td></tr></table>' +
      '<p style="font-size:8pt;color:#7f7f7f;border-top:1px solid #bfbfbf;margin-top:10pt">Confidential \u2014 Internal Audit Use Only</p></body></html>';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff', html], { type: 'application/msword' }));
    a.download = 'Audit_Summary.doc';
    a.click();
  }
</script>
</body>
</html>
