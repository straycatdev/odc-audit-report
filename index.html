<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAM Summary Report</title>

<style>
  @page {
    size: Letter;
    margin: 0.6in 0.7in 0.7in;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #e9ecf1;
    font-family: Arial, Calibri, sans-serif;
    font-size: 10pt;
    color: #222;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 10px;
    background: #1f3a5f;
    text-align: center;
  }

  .toolbar button {
    margin: 4px;
    padding: 8px 16px;
    border: 0;
    border-radius: 4px;
    background: #fff;
    color: #1f3a5f;
    font: bold 13px Arial;
    cursor: pointer;
  }

  .toolbar button:hover { background: #d9e2f3; }

  .page {
    width: 8.5in;
    margin: 20px auto;
    padding: 0.6in 0.7in 0.7in;
    background: #fff;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .2);
  }

  .page.first {
    height: 11in;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .banner {
    padding: 8px 12px;
    background: #1f3a5f;
    color: #fff;
  }

  .banner h1 { margin: 0; font-size: 18pt; }
  .banner div { font-size: 9pt; color: #d9e2f3; }

  table.meta {
    width: 100%;
    margin-top: 10px;
    border-collapse: collapse;
  }

  .meta td {
    height: 0.34in;
    padding: 6px 8px;
    border: 1px solid #bfbfbf;
    font-size: 9.5pt;
    overflow-wrap: anywhere;
  }

  .meta td.l {
    width: 17%;
    background: #e7ecf4;
    color: #1f3a5f;
    font-size: 9pt;
    font-weight: bold;
  }

  .meta td.v { width: 33%; background: #f7f7f7; }

  .meta select {
    border: 0;
    background: transparent;
    font: inherit;
    cursor: pointer;
  }

  h2 {
    margin: 12px 0 5px;
    padding-bottom: 2px;
    border-bottom: 2px solid #1f3a5f;
    color: #1f3a5f;
    font-size: 10.5pt;
    text-transform: uppercase;
  }

  [contenteditable]:focus { outline: 2px solid #8496b0; }

  [data-ph]:empty::before {
    content: attr(data-ph);
    color: #7f7f7f;
  }

  #slots {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slot {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 2px dashed #8496b0;
    background: #fafbfd;
    text-align: center;
    cursor: pointer;
  }

  .slot.active { border-color: #1f3a5f; background: #f1f5fb; }

  .slot .hint {
    padding: 10px;
    color: #8a99ae;
    font-size: 11pt;
    font-weight: bold;
  }

  .slot img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .x {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #1f3a5f;
    color: #fff;
    font-weight: bold;
    line-height: 22px;
    cursor: pointer;
  }

  #remarks {
    flex: none;
    height: 1.1in;
    padding: 6px 10px;
    overflow: hidden;
    border: 1px solid #1f3a5f;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  #remarks:empty::before { font-style: italic; }

  footer {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 4px;
    border-top: 1px solid #bfbfbf;
    color: #7f7f7f;
    font-size: 8pt;
  }

  #extras {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .thumb {
    position: relative;
    padding: 4px;
    border: 1px solid #bfbfbf;
    break-inside: avoid;
  }

  .thumb img { display: block; width: 100%; }

  #extraHint {
    margin-top: 10px;
    padding: 18px;
    border: 2px dashed #8496b0;
    background: #fafbfd;
    color: #8a99ae;
    font-weight: bold;
    text-align: center;
  }

  #page2.empty { display: none; }

  @media print {
    body { background: #fff; }
    .toolbar, .x, #extraHint { display: none; }

    .page {
      width: auto;
      margin: 0;
      padding: 0;
      box-shadow: none;
    }

    .page.first { height: 9.65in; }
    #page2 { break-before: page; }
    .slot, .slot.active { border-style: solid; background: #fff; }

    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>

<body>
<div class="toolbar">
  <button type="button" onclick="window.print()">Save as PDF / Print</button>
  <button type="button" onclick="downloadWord()">Download Word (.doc)</button>
  <button type="button" onclick="clearImages()">Clear images</button>
  <button type="button" onclick="newReport()">New report</button>
</div>

<div class="page first">
  <div class="banner">
    <h1>PAM SUMMARY REPORT</h1>
    <div>Privileged Access Management | Evidence &amp; Remarks Record</div>
  </div>

  <table class="meta">
    <tr>
      <td class="l">User</td>
      <td class="v" contenteditable="true" data-ph="[ Enter user ]"></td>
      <td class="l">Username</td>
      <td class="v" contenteditable="true" data-ph="[ Enter username ]"></td>
    </tr>
    <tr>
      <td class="l">Date &amp; Shift</td>
      <td class="v">
        <span id="dt" contenteditable="true" data-ph="[ DD/MM/YYYY ]"></span>
        <select id="shift" aria-label="Shift">
          <option>Morning</option>
          <option>Mid</option>
          <option>Night</option>
        </select>
      </td>
      <td class="l">User IP</td>
      <td class="v" contenteditable="true" data-ph="[ e.g. 10.0.0.25 ]"></td>
    </tr>
  </table>

  <h2>Evidence / Visual Proof</h2>
  <div id="slots">
    <div class="slot"></div>
    <div class="slot"></div>
  </div>

  <h2>Remarks</h2>
  <div id="remarks" contenteditable="true" data-ph="[ Enter remarks here... ]"></div>

  <footer>
    <span>Confidential — Internal Audit Use Only</span>
    <span>Page 1</span>
  </footer>
</div>

<div class="page empty" id="page2">
  <h2 style="margin-top: 0">Additional Evidence</h2>
  <div id="extras"></div>
  <div id="extraHint">[ PASTE MORE SCREENSHOTS HERE AFTER THE FIRST 2 ARE FILLED ]</div>
</div>

<script>
  const KEY = 'pamSummaryDraft.v1';
  const slotEls = [...document.querySelectorAll('.slot')];
  const extrasEl = document.getElementById('extras');
  const page2 = document.getElementById('page2');
  const remarksEl = document.getElementById('remarks');
  const shiftSel = document.getElementById('shift');
  const dtEl = document.getElementById('dt');
  const fields = [...document.querySelectorAll('.meta td.v[contenteditable]')];

  let images = [null, null];
  let activeSlot = -1;
  let readQueue = Promise.resolve();

  function validImage(src) {
    return typeof src === 'string' &&
      /^data:image\/[a-z0-9.+-]+;base64,/i.test(src);
  }

  function createEvidence(src, index) {
    const fragment = document.createDocumentFragment();
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Evidence ' + (index + 1);

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'x';
    button.title = 'Remove image';
    button.setAttribute('aria-label', 'Remove evidence ' + (index + 1));
    button.dataset.rm = String(index);
    button.textContent = '×';

    fragment.append(img, button);
    return fragment;
  }

  function render() {
    slotEls.forEach((slot, index) => {
      slot.classList.toggle('active', index === activeSlot);
      slot.replaceChildren();

      if (images[index]) {
        slot.append(createEvidence(images[index], index));
      } else {
        const hint = document.createElement('span');
        hint.className = 'hint';
        hint.textContent = '[ CLICK HERE, THEN PASTE (Ctrl+V) SCREENSHOT ]';
        slot.append(hint);
      }
    });

    extrasEl.replaceChildren();

    images.slice(2).forEach((src, index) => {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.append(createEvidence(src, index + 2));
      extrasEl.append(thumb);
    });

    page2.classList.toggle('empty', images.length <= 2);
  }

  function addImage(src) {
    if (!validImage(src)) return;

    const index = activeSlot >= 0
      ? activeSlot
      : images.slice(0, 2).indexOf(null);

    if (index >= 0 && index < 2) {
      images[index] = src;
    } else {
      images.push(src);
    }

    activeSlot = -1;
    render();
    save();
  }

  function removeImage(index) {
    if (index < 2) images[index] = null;
    else images.splice(index, 1);

    render();
    save();
  }

  function readFile(file) {
    if (!file || !file.type.startsWith('image/')) return;

    // Read multiple files in order.
    readQueue = readQueue.then(() => new Promise(resolve => {
      const reader = new FileReader();

      reader.onload = () => {
        addImage(reader.result);
        resolve();
      };

      reader.onerror = resolve;
      reader.onabort = resolve;
      reader.readAsDataURL(file);
    })).catch(error => console.warn('Unable to read image:', error));
  }

  function clearImages() {
    images = [null, null];
    activeSlot = -1;
    render();
    save();
  }

  slotEls.forEach((slot, index) => {
    slot.addEventListener('click', event => {
      if (event.target.closest('[data-rm]')) return;
      activeSlot = index;
      render();
    });

    slot.addEventListener('dragover', event => event.preventDefault());

    slot.addEventListener('drop', event => {
      event.preventDefault();
      activeSlot = index;
      [...event.dataTransfer.files].forEach(readFile);
    });

    slot.addEventListener('dblclick', event => {
      if (event.target.closest('[data-rm]')) return;

      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.multiple = true;
      activeSlot = index;
      input.onchange = () => [...input.files].forEach(readFile);
      input.click();
    });
  });

  document.addEventListener('click', event => {
    const button = event.target.closest('[data-rm]');
    if (button) removeImage(Number(button.dataset.rm));
  });

  document.addEventListener('paste', event => {
    const clipboard = event.clipboardData;
    if (!clipboard) return;

    const imageItems = [...clipboard.items]
      .filter(item => item.type.startsWith('image/'));

    if (imageItems.length) {
      event.preventDefault();
      imageItems.forEach(item => readFile(item.getAsFile()));
      return;
    }

    if (event.target.isContentEditable) {
      event.preventDefault();
      document.execCommand('insertText', false, clipboard.getData('text/plain'));
      fitRemarks();
      save();
    }
  });

  function today() {
    const date = new Date();
    const pad = value => String(value).padStart(2, '0');
    return pad(date.getDate()) + '/' +
      pad(date.getMonth() + 1) + '/' + date.getFullYear();
  }

  function guessShift() {
    const hour = new Date().getHours();
    return hour >= 6 && hour < 14
      ? 'Morning'
      : hour >= 14 && hour < 22 ? 'Mid' : 'Night';
  }

  function save() {
    const data = {
      fields: fields.map(field => field.textContent),
      date: dtEl.textContent,
      shift: shiftSel.value,
      remarks: remarksEl.innerText,
      images
    };

    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (error) {
      console.warn('Draft could not be saved. Browser storage may be full.', error);
    }
  }

  function load() {
    let data = null;

    try {
      data = JSON.parse(localStorage.getItem(KEY));
    } catch (error) {
      console.warn('Saved draft could not be read.', error);
    }

    shiftSel.value = guessShift();

    if (data && typeof data === 'object') {
      const values = Array.isArray(data.fields) ? data.fields : [];

      fields.forEach((field, index) => {
        field.textContent = typeof values[index] === 'string' ? values[index] : '';
      });

      dtEl.textContent = typeof data.date === 'string' ? data.date : '';
      remarksEl.textContent = typeof data.remarks === 'string' ? data.remarks : '';

      if (['Morning', 'Mid', 'Night'].includes(data.shift)) {
        shiftSel.value = data.shift;
      }

      if (Array.isArray(data.images)) {
        images = [
          validImage(data.images[0]) ? data.images[0] : null,
          validImage(data.images[1]) ? data.images[1] : null,
          ...data.images.slice(2).filter(validImage)
        ];
      }
    }

    if (!dtEl.textContent.trim()) dtEl.textContent = today();
    render();
    fitRemarks();
  }

  function fitRemarks() {
    let size = 10;
    remarksEl.style.fontSize = size + 'pt';

    while (remarksEl.scrollHeight > remarksEl.clientHeight && size > 6) {
      size -= 0.5;
      remarksEl.style.fontSize = size + 'pt';
    }
  }

  function newReport() {
    if (!confirm('Clear everything and start a new report?')) return;

    fields.forEach(field => field.textContent = '');
    remarksEl.textContent = '';
    dtEl.textContent = today();
    shiftSel.value = guessShift();
    clearImages();
    fitRemarks();
  }

  document.addEventListener('input', () => {
    fitRemarks();
    save();
  });

  shiftSel.addEventListener('change', save);
  window.addEventListener('beforeprint', fitRemarks);

  function esc(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function downloadWord() {
    const values = fields.map(field => esc(field.textContent.trim()) || '&nbsp;');
    const date = esc(dtEl.textContent.trim()) +
      ' &mdash; ' + esc(shiftSel.value) + ' shift';
    const remarks = esc(remarksEl.innerText.trim() || '[ Enter remarks here... ]')
      .replace(/\n/g, '<br>');

    const label = (text, value) =>
      '<td style="background:#e7ecf4;border:1px solid #bfbfbf;padding:6px;' +
      'font-weight:bold;color:#1f3a5f;width:17%">' + text +
      '</td><td style="background:#f7f7f7;border:1px solid #bfbfbf;' +
      'padding:6px;width:33%">' + value + '</td>';

    const heading = text =>
      '<p style="font-size:10.5pt;font-weight:bold;color:#1f3a5f;' +
      'border-bottom:2px solid #1f3a5f;margin:12pt 0 4pt">' + text + '</p>';

    const box = (src, height) =>
      '<table width="100%" style="border-collapse:collapse;margin-bottom:6pt">' +
      '<tr><td align="center" height="' + height +
      '" style="border:1px dashed #8496b0;background:#fafbfd;color:#8a99ae;' +
      'font-weight:bold">' +
      (src
        ? '<img src="' + esc(src) + '" style="max-width:6.4in;max-height:' +
          (height - 10) + 'px">'
        : '[ SCREENSHOT ]') +
      '</td></tr></table>';

    let extra = '';

    if (images.length > 2) {
      extra = '<div style="page-break-before:always">' +
        heading('ADDITIONAL EVIDENCE') +
        images.slice(2).map(src =>
          '<p align="center"><img src="' + esc(src) +
          '" style="max-width:6.6in"></p>'
        ).join('') + '</div>';
    }

    const html =
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:w="urn:schemas-microsoft-com:office:word">' +
      '<head><meta charset="utf-8"><title>PAM Summary Report</title>' +
      '<style>@page{size:8.5in 11in;margin:0.6in 0.7in 0.7in}' +
      'body{font-family:Arial;font-size:10pt}' +
      'td{font-family:Arial;font-size:9.5pt}</style></head><body>' +
      '<table width="100%" style="border-collapse:collapse"><tr>' +
      '<td style="background:#1f3a5f;color:#fff;padding:8px">' +
      '<b style="font-size:18pt">PAM SUMMARY REPORT</b><br>' +
      '<span style="font-size:9pt;color:#d9e2f3">' +
      'Privileged Access Management | Evidence &amp; Remarks Record' +
      '</span></td></tr></table><br>' +
      '<table width="100%" style="border-collapse:collapse"><tr>' +
      label('User', values[0]) + label('Username', values[1]) +
      '</tr><tr>' + label('Date &amp; Shift', date) +
      label('User IP', values[2]) + '</tr></table>' +
      heading('EVIDENCE / VISUAL PROOF') +
      box(images[0], 190) + box(images[1], 190) +
      heading('REMARKS') +
      '<table width="100%" style="border-collapse:collapse"><tr>' +
      '<td height="80" valign="top" style="border:1px solid #1f3a5f;padding:8px">' +
      remarks + '</td></tr></table>' +
      '<p style="font-size:8pt;color:#7f7f7f;border-top:1px solid #bfbfbf;' +
      'margin-top:10pt">Confidential — Internal Audit Use Only</p>' +
      extra + '</body></html>';

    const url = URL.createObjectURL(
      new Blob(['\ufeff', html], { type: 'application/msword' })
    );

    const link = document.createElement('a');
    link.href = url;
    link.download = 'PAM_Summary_Report.doc';
    document.body.append(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  load();
</script>
</body>
</html>
