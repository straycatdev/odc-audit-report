<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODC | PAM Internal Audit Tool</title>
  <style>
    :root { color-scheme: light; --ink: #18324f; --muted: #586b7e; --line: #ccd6e0; --accent: #215b83; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf1f5; color: #213346; font: 14px/1.5 Arial, Calibri, sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: #fff; color: var(--ink); font-weight: 600; }
    button:hover { background: #edf4fa; }
    button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    button:disabled { cursor: wait; opacity: .6; }
    :focus-visible { outline: 3px solid #5297c7; outline-offset: 2px; }
    .app-header { background: #fff; border-bottom: 1px solid var(--line); padding: 20px max(20px, calc((100% - 1056px) / 2)); }
    .brand { margin: 0; color: var(--ink); font-size: 19px; font-weight: 700; }
    .app-header p { margin: 4px 0 0; color: var(--muted); }
    .controls { max-width: 1056px; margin: 20px auto; padding: 18px 22px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .actions, .options { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .options { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e5ebf0; justify-content: space-between; }
    .check { display: flex; align-items: center; gap: 8px; }
    .check input { width: 17px; height: 17px; accent-color: var(--accent); }
    #status { margin: 8px 0 0; font-size: 12px; }
    #status.warning, #overflowWarning { color: #914711; }
    #overflowWarning { margin: 8px 0 0; font-weight: 600; }
    [hidden] { display: none !important; }
    .workspace { padding: 0 16px 32px; }
    .page { width: 8.5in; height: 11in; margin: 24px auto; padding: .48in .55in; background: #fff; box-shadow: 0 3px 20px #18324f18; display: flex; flex-direction: column; gap: 14px; }
    .report-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ink); padding-bottom: 15px; gap: 16px; }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { margin: 0; color: var(--ink); font-size: 25px; line-height: 1.2; letter-spacing: -.4px; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .classification { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; text-align: right; }
    .metadata { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 5px; }
    .field { padding: 10px 12px; min-width: 0; }
    .field:nth-child(odd) { border-right: 1px solid var(--line); }
    .field:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .field-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
    .field input, .field select { width: 100%; min-width: 0; padding: 5px 6px; border: 1px solid #dce3ea; border-radius: 4px; background: #fbfcfe; color: #213346; font-size: 13px; }
    .date-row { display: flex; gap: 6px; align-items: center; }
    .date-row input { flex: 1; }
    .date-row button { padding: 5px 8px; font-size: 11px; }
    .date-shift { display: grid; grid-template-columns: minmax(0, 1fr) 86px; gap: 8px; }
    .section-title { margin: 0; color: var(--ink); font-size: 12px; letter-spacing: .8px; text-transform: uppercase; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    .section-note { color: var(--muted); font-size: 10px; }
    .primary-artefacts { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
    .artefact-grid { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
    .artefact { margin: 0; border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: #fff; }
    .primary-artefacts .artefact { flex: 1; }
    .image-area { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
    .image-area.active { outline: 2px solid var(--accent); outline-offset: -2px; }
    .image-area img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .empty-image { border: 0; background: transparent; width: 100%; height: 100%; border-radius: 0; color: var(--muted); font-size: 12px; font-weight: 400; }
    .empty-image strong { display: block; margin-bottom: 4px; color: var(--ink); }
    .image-tools { position: absolute; right: 7px; top: 7px; display: flex; gap: 5px; }
    .image-tools button { padding: 3px 7px; font-size: 10px; background: #fffffff2; }
    figcaption { display: flex; gap: 8px; padding: 6px 9px; border-top: 1px solid var(--line); font-size: 11px; align-items: center; }
    .artefact-number { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .remarks-section { display: flex; flex-direction: column; gap: 7px; }
    #remarks { width: 100%; height: 94px; resize: none; border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; line-height: 1.45; color: #213346; font-size: 12px; }
    footer { display: flex; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); font-size: 9px; }
    .print-value { display: none; }
    @media screen and (max-width: 850px) {
      .controls { margin: 12px; padding: 16px; }
      .workspace { overflow-x: auto; padding: 0 12px 24px; }
      .page { margin: 16px auto; }
    }
    @page { size: Letter; margin: .48in .55in; }
    @media print {
      body { background: #fff; }
      .no-print, .image-tools, .empty-image { display: none !important; }
      .workspace { padding: 0; }
      .page { width: 100%; height: 10.02in; margin: 0; padding: 0; box-shadow: none; }
      .appendix { break-before: page; page-break-before: always; }
      .field input, .field select, #remarks, .caption { display: none; }
      .print-value { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
      .field .print-value { min-height: 25px; font-size: 13px; }
      .remarks-print { min-height: 94px; border: 1px solid var(--line); padding: 9px 11px; font-size: 12px; line-height: 1.45; }
      figcaption .print-value { font-size: 11px; }
      .image-area { background: #fff; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header class="app-header no-print">
    <p class="brand">ODC · PAM Internal Audit Tool</p>
  </header>
  <section class="controls no-print" aria-label="Report controls">
    <div class="actions">
      <button class="primary" id="printButton" type="button">Save PDF / Print</button>
      <button id="wordButton" type="button">Download Word (.doc)</button>
      <button id="clearButton" type="button">Clear images</button>
      <button id="newButton" type="button">New report</button>
    </div>
    <div class="options">
      <label class="check"><input id="includeAppendix" type="checkbox"> Multiple artefacts (3+)</label>
      <div id="pageControls" class="actions" hidden><button id="addPageButton" type="button">Add page</button><button id="removePageButton" type="button">Remove last page</button></div>
      <span id="pageSummary" class="section-note"></span>
    </div>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <p id="overflowWarning" role="alert" hidden>Remarks exceed the available space. Shorten them before exporting.</p>
  </section>
  <main class="workspace" id="report" aria-label="Report preview">
    <article class="page" id="firstPage" aria-label="Report page 1">
      <header class="report-header">
        <div><p class="eyebrow">ODC Managed</p><h1>PAM Summary Report</h1><p class="subtitle">Privileged Access Management</p></div>
        <div class="classification">Internal audit<br>Confidential</div>
      </header>
      <section class="metadata" aria-label="Report details">
        <div class="field"><label class="field-label" for="user">User name</label><input id="user" autocomplete="off" placeholder="Full name" maxlength="120"><span class="print-value" data-for="user"></span></div>
        <div class="field"><label class="field-label" for="username">PAM username</label><input id="username" autocomplete="off" placeholder="Account username" maxlength="120"><span class="print-value" data-for="username"></span></div>
        <div class="field">
          <div class="date-shift">
            <div><label class="field-label" for="reportDate">Report date</label><div class="date-row"><input id="reportDate" type="date"><button id="todayButton" class="no-print" type="button">Today</button></div><span class="print-value" data-for="reportDate"></span></div>
            <div><label class="field-label" for="shift">Shift</label><select id="shift"><option>Morning</option><option>Mid</option><option>Night</option></select><span class="print-value" data-for="shift"></span></div>
          </div>
        </div>
        <div class="field"><label class="field-label" for="ip">User IP address</label><input id="ip" autocomplete="off" placeholder="IPv4 or IPv6 address" maxlength="80"><span class="print-value" data-for="ip"></span></div>
      </section>
      <div class="section-heading"><h2 class="section-title">PAM Artefacts</h2><span class="section-note">Primary supporting material</span></div>
      <section id="primaryArtefacts" class="primary-artefacts" aria-label="Primary PAM artefacts"></section>
      <section class="remarks-section"><label class="section-title" for="remarks">Audit remarks</label><textarea id="remarks" placeholder="Record observations, exceptions, and required follow-up actions."></textarea><div id="remarksPrint" class="print-value remarks-print"></div></section>
      <footer><span>ODC Managed - PAM Internal Audit Tool</span><span class="page-number"></span></footer>
    </article>
    <div id="appendixPages"></div>
  </main>
  <script>
    'use strict';
    const KEY = 'odcPamAuditDraft.v2';
    const LEGACY_KEY = 'pamSummaryDraft.v1';
    const $ = id => document.getElementById(id);
    const fieldIds = ['user', 'username', 'ip', 'reportDate', 'shift', 'remarks'];
    let images = [null, null];
    let includeAppendix = false;
    let additionalPages = 1;
    let targetSlot = null;
    let saveTimer;
    let busy = false;

    function localDate() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function defaultShift() {
      const hour = new Date().getHours();
      return hour >= 6 && hour < 14 ? 'Morning' : hour >= 14 && hour < 22 ? 'Mid' : 'Night';
    }
    function normalizeDate(value) {
      if (typeof value !== 'string') return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      const match = value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      return match ? match[3] + '-' + match[2] + '-' + match[1] : '';
    }
    function formattedDate(value) {
      if (!value) return 'Not specified';
      return new Date(value + 'T12:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function validImage(src) { return typeof src === 'string' && /^data:image\/(png|jpeg|jpg|webp|gif|bmp);base64,/i.test(src); }
    function imageRecord(value) {
      const record = typeof value === 'string' ? { src: value, caption: '' } : value;
      return record && validImage(record.src) ? { src: record.src, caption: String(record.caption || '').slice(0, 180), width: Number(record.width) || 0, height: Number(record.height) || 0 } : null;
    }
    function setStatus(message, warning = false) {
      $('status').textContent = warning ? message : '';
      $('status').hidden = !warning;
      $('status').classList.toggle('warning', warning);
    }
    function draft() {
      return { fields: Object.fromEntries(fieldIds.map(id => [id, $(id).value])), images, includeAppendix, additionalPages };
    }
    function save() {
      clearTimeout(saveTimer);
      try {
        localStorage.setItem(KEY, JSON.stringify(draft()));
        setStatus('');
      } catch (error) {
        setStatus('Draft not saved: browser storage is unavailable or full. Export your report before leaving.', true);
      }
    }
    function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }
    function load() {
      $('reportDate').value = localDate();
      $('shift').value = defaultShift();
      try {
        const current = localStorage.getItem(KEY);
        const data = JSON.parse(current || localStorage.getItem(LEGACY_KEY) || 'null');
        if (data && typeof data === 'object') {
          const fields = Array.isArray(data.fields)
            ? { user: data.fields[0], username: data.fields[1], ip: data.fields[2], reportDate: data.date, shift: data.shift, remarks: data.remarks }
            : data.fields || {};
          fieldIds.forEach(id => { if (typeof fields[id] === 'string') $(id).value = id === 'reportDate' ? normalizeDate(fields[id]) : fields[id]; });
          if (!$('reportDate').value) $('reportDate').value = localDate();
          if (!['Morning', 'Mid', 'Night'].includes($('shift').value)) $('shift').value = defaultShift();
          if (Array.isArray(data.images)) images = [imageRecord(data.images[0]), imageRecord(data.images[1]), ...data.images.slice(2).map(imageRecord)];
          includeAppendix = typeof data.includeAppendix === 'boolean' ? data.includeAppendix : images.length > 2;
          additionalPages = Math.max(1, Math.ceil((images.length - 2) / 2), Number.isSafeInteger(data.additionalPages) && data.additionalPages > 0 ? data.additionalPages : 1);
          setStatus(current ? 'Saved draft restored.' : 'Previous report draft restored.');
        } else setStatus('Ready. Your draft will be saved in this browser.');
      } catch (error) { setStatus('The saved draft could not be read. A new report is ready.', true); }
      render();
    }
    function makeButton(text, label, action) {
      const button = document.createElement('button');
      button.type = 'button'; button.textContent = text; button.setAttribute('aria-label', label);
      button.addEventListener('click', event => { event.stopPropagation(); action(); });
      return button;
    }
    function activate(index) {
      targetSlot = index;
      document.querySelectorAll('.image-area').forEach(area => area.classList.toggle('active', Number(area.dataset.index) === index));
    }
    function createArtefact(index) {
      const record = images[index];
      const figure = document.createElement('figure'); figure.className = 'artefact';
      const area = document.createElement('div'); area.className = 'image-area'; area.dataset.index = index;
      area.tabIndex = 0; area.setAttribute('aria-label', 'Artefact ' + (index + 1) + '. Click here, then press Ctrl+V to paste a screenshot.');
      area.addEventListener('click', event => { event.stopPropagation(); activate(index); area.focus(); });
      area.addEventListener('focus', () => activate(index));
      area.addEventListener('keydown', event => { if (event.target === area && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); activate(index); } });
      if (record) {
        const img = document.createElement('img'); img.src = record.src; img.alt = record.caption || 'PAM artefact ' + (index + 1); area.append(img);
        const tools = document.createElement('div'); tools.className = 'image-tools no-print';
        tools.append(makeButton('Replace', 'Select artefact ' + (index + 1) + ', then press Ctrl+V to replace it', () => { activate(index); area.focus(); }), makeButton('Remove', 'Remove artefact ' + (index + 1), () => removeImage(index)));
        area.append(tools);
      } else {
        const button = makeButton('', 'Paste screenshot into artefact ' + (index + 1), () => { activate(index); area.focus(); }); button.className = 'empty-image no-print';
        const title = document.createElement('strong'); title.textContent = 'Paste PAM artefact';
        button.append(title, document.createTextNode('Click here, then press Ctrl+V to paste your snip.')); area.append(button);
      }
      const caption = document.createElement('figcaption');
      const number = document.createElement('span'); number.className = 'artefact-number'; number.textContent = 'Artefact ' + (index + 1);
      caption.append(number); figure.append(area, caption); return figure;
    }
    function render() {
      $('includeAppendix').checked = includeAppendix;
      $('pageControls').hidden = !includeAppendix;
      $('removePageButton').hidden = additionalPages <= 1;
      $('primaryArtefacts').replaceChildren(createArtefact(0), createArtefact(1));
      $('appendixPages').replaceChildren();
      const appendixCount = includeAppendix ? additionalPages : 0;
      const total = 1 + appendixCount;
      $('firstPage').querySelector('.page-number').textContent = 'Page 1 of ' + total;
      for (let pageIndex = 0; pageIndex < appendixCount; pageIndex++) {
        const page = document.createElement('article'); page.className = 'page appendix'; page.setAttribute('aria-label', 'Report page ' + (pageIndex + 2));
        const header = document.createElement('header'); header.className = 'report-header';
        const titles = document.createElement('div');
        const eyebrow = document.createElement('p'); eyebrow.className = 'eyebrow'; eyebrow.textContent = 'PAM Summary Report';
        const heading = document.createElement('h1'); heading.textContent = 'Additional PAM Artefacts'; heading.style.fontSize = '22px';
        const subtitle = document.createElement('p'); subtitle.className = 'subtitle'; subtitle.textContent = 'Supporting material · ' + formattedDate($('reportDate').value);
        titles.append(eyebrow, heading, subtitle); header.append(titles);
        const grid = document.createElement('section'); grid.className = 'artefact-grid'; grid.setAttribute('aria-label', 'Additional artefacts');
        const start = 2 + pageIndex * 2;
        for (let i = start; i < start + 2; i++) grid.append(createArtefact(i));
        page.tabIndex = 0;
        page.addEventListener('click', () => { const empty = Array.from({ length: 2 }, (_, k) => start + k).find(i => !images[i]); activate(empty === undefined ? 2 + additionalPages * 2 : empty); page.focus(); });
        const footer = document.createElement('footer');
        const brand = document.createElement('span'); brand.textContent = 'ODC Managed - PAM Internal Audit Tool';
        const pageNumber = document.createElement('span'); pageNumber.textContent = 'Page ' + (pageIndex + 2) + ' of ' + total;
        footer.append(brand, pageNumber); page.append(header, grid, footer); $('appendixPages').append(page);
      }
      $('pageSummary').textContent = total + (total === 1 ? ' page' : ' pages') + ' selected · ' + images.filter(Boolean).length + ' artefacts attached' + (!includeAppendix && images.length > 2 ? ' · ' + (images.length - 2) + ' excluded from export' : '');
      targetSlot = null;
      syncPrint();
    }
    function removeImage(index) {
      if (busy) return;
      if (index < 2) images[index] = null; else images.splice(index, 1);
      while (images.length > 2 && !images[images.length - 1]) images.pop();
      render(); save();
    }
    async function readImage(file) {
      const src = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
      const image = await new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = src; });
      // Keep screenshots legible while limiting browser-storage pressure.
      const scale = Math.min(1, 2000 / Math.max(image.naturalWidth, image.naturalHeight));
      const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(image.naturalWidth * scale)); canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const context = canvas.getContext('2d'); context.fillStyle = '#fff'; context.fillRect(0, 0, canvas.width, canvas.height); context.drawImage(image, 0, 0, canvas.width, canvas.height);
      return { src: canvas.toDataURL('image/jpeg', .9), caption: '', width: canvas.width, height: canvas.height };
    }
    async function addFiles(files, index = null) {
      if (busy) return;
      const accepted = files.filter(file => /^image\/(png|jpeg|webp|gif|bmp)$/i.test(file.type));
      if (!accepted.length) { setStatus('Copy a screenshot with Snipping Tool, then press Ctrl+V in an artefact area.', true); return; }
      busy = true; document.querySelectorAll('.controls button').forEach(button => button.disabled = true);
      let failed = files.length - accepted.length;
      let blockedMessage = '';
      let lastSlot = index;
      try {
        for (const file of accepted) {
          try {
            if (file.size > 25 * 1024 * 1024) { failed++; continue; }
            const record = await readImage(file);
            let slot = index !== null ? index : images.slice(0, 2).indexOf(null);
            if (slot < 0 && includeAppendix) { slot = images.findIndex((image, i) => i >= 2 && !image); if (slot < 0) slot = images.length; }
            if (slot < 0 || (slot >= 2 && !includeAppendix)) { blockedMessage = 'Tick “Multiple artefacts (3+)” to enable page 2, then paste again.'; break; }
            if (slot >= 2 + additionalPages * 2) { blockedMessage = 'All available spaces are filled. Select “Add page”, then paste your next screenshot.'; break; }
            while (images.length <= slot) images.push(null);
            images[slot] = record;
            lastSlot = slot;
            index = null;
          } catch (error) { failed++; }
        }
        render(); save();
        if (blockedMessage) setStatus(blockedMessage, true);
        const next = lastSlot >= 2 ? images.findIndex((image, i) => i >= 2 && !image) : images.slice(0, 2).indexOf(null);
        if (next >= 0) activate(next);
        else if (includeAppendix) activate(images.length);
        if (failed) setStatus(failed + ' file(s) skipped. Use supported images under 25 MB each. Other images were added; check the draft storage status before leaving.', true);
      } finally { busy = false; document.querySelectorAll('.controls button').forEach(button => button.disabled = false); }
    }
    function syncPrint() {
      document.querySelectorAll('[data-for]').forEach(span => { const id = span.dataset.for; span.textContent = id === 'reportDate' ? formattedDate($(id).value) : $(id).value.trim() || 'Not specified'; });
      $('remarksPrint').textContent = $('remarks').value.trim() || 'No remarks recorded.';
      $('overflowWarning').hidden = $('remarks').scrollHeight <= $('remarks').clientHeight + 2;
    }
    function canExport() {
      syncPrint();
      if (!$('overflowWarning').hidden) { alert('Please shorten the audit remarks to fit the available space before exporting.'); $('remarks').focus(); return false; }
      if (busy) { setStatus('Please wait for the images to finish loading.', true); return false; }
      save(); return true;
    }
    function esc(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
    function buildWord() {
      const footer = (page, total) => '<p style="border-top:1px solid #ccd6e0;padding-top:8px;color:#586b7e;font-size:8pt">ODC Managed - PAM Internal Audit Tool <span style="float:right">Page ' + page + ' of ' + total + '</span></p>';
      const imageHtml = (record, index, extra = false) => {
        const maxWidth = 690, maxHeight = extra ? 340 : 190;
        const preview = document.querySelector('.image-area[data-index="' + index + '"] img');
        const width = record && (record.width || (preview && preview.naturalWidth)) || maxWidth;
        const height = record && (record.height || (preview && preview.naturalHeight)) || maxHeight;
        const scale = Math.min(maxWidth / width, maxHeight / height, 1);
        const w = Math.round(width * scale), h = Math.round(height * scale);
        return '<table width="100%" style="border-collapse:collapse;margin:10px 0;page-break-inside:avoid"><tr><td align="center" height="' + maxHeight + '" style="border:1px solid #ccd6e0">' + (record ? '<img alt="PAM artefact ' + (index + 1) + '" src="' + esc(record.src) + '" width="' + w + '" height="' + h + '" style="width:' + w + 'px;height:' + h + 'px">' : '&nbsp;') + '</td></tr><tr><td style="border:1px solid #ccd6e0;padding:5px;font-size:9pt"><b>Artefact ' + (index + 1) + '</b></td></tr></table>';
      };
      const count = includeAppendix ? additionalPages : 0;
      const cell = (label, value) => '<td width="50%" style="border:1px solid #ccd6e0;padding:9px"><b style="color:#586b7e;font-size:8pt">' + label + '</b><br>' + esc(value || 'Not specified') + '</td>';
      let body = '<h1>PAM Summary Report</h1><p>Privileged Access Management</p><table width="100%" style="border-collapse:collapse"><tr>' + cell('User name', $('user').value) + cell('PAM username', $('username').value) + '</tr><tr>' + cell('Report date / Shift', formattedDate($('reportDate').value) + ' / ' + $('shift').value) + cell('User IP address', $('ip').value) + '</tr></table><h2>PAM Artefacts</h2>' + imageHtml(images[0], 0) + imageHtml(images[1], 1) + '<h2>Audit remarks</h2><div style="border:1px solid #ccd6e0;padding:10px;min-height:70px">' + esc($('remarks').value.trim() || 'No remarks recorded.').replace(/\n/g, '<br>') + '</div>' + footer(1, count + 1);
      for (let p = 0; p < count; p++) {
        body += '<div style="page-break-before:always"><h1>Additional PAM Artefacts</h1><p>PAM Summary Report · ' + esc(formattedDate($('reportDate').value)) + '</p>';
        for (let row = 0; row < 2; row++) { const index = 2 + p * 2 + row; body += imageHtml(images[index], index, true); }
        body += footer(p + 2, count + 1) + '</div>';
      }
      return '<!DOCTYPE html><html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>PAM Summary Report</title><style>@page{size:8.5in 11in;margin:.48in .55in}body{font-family:Arial;color:#213346;font-size:10pt}h1{font-size:20pt;color:#18324f}h2{font-size:11pt;color:#18324f;border-bottom:1px solid #ccd6e0;padding-bottom:5px}td{font-family:Arial;font-size:10pt}</style></head><body>' + body + '</body></html>';
    }
    $('includeAppendix').addEventListener('change', () => { includeAppendix = $('includeAppendix').checked; render(); save(); });
    $('addPageButton').addEventListener('click', () => { if (busy) return; additionalPages++; render(); save(); const page = $('appendixPages').lastElementChild; page.scrollIntoView({ behavior: 'smooth', block: 'start' }); page.querySelector('.image-area').focus({ preventScroll: true }); });
    $('removePageButton').addEventListener('click', () => { if (busy || additionalPages <= 1) return; const start = 2 + (additionalPages - 1) * 2; if (images.slice(start).some(Boolean) && !confirm('Remove the last page and its attached images?')) return; images = images.slice(0, start); additionalPages--; render(); save(); });
    $('todayButton').addEventListener('click', () => { $('reportDate').value = localDate(); render(); save(); });
    fieldIds.forEach(id => $(id).addEventListener('input', () => { syncPrint(); scheduleSave(); if (id === 'reportDate') document.querySelectorAll('.appendix .subtitle').forEach(p => p.textContent = 'Supporting material · ' + formattedDate($('reportDate').value)); }));
    $('clearButton').addEventListener('click', () => { if (confirm('Remove all attached images? Report details and remarks will be kept.')) { images = [null, null]; render(); save(); } });
    $('newButton').addEventListener('click', () => { if (confirm('Start a new report? This will replace the current draft, including all images.')) { fieldIds.forEach(id => $(id).value = ''); $('reportDate').value = localDate(); $('shift').value = defaultShift(); images = [null, null]; includeAppendix = false; additionalPages = 1; render(); save(); } });
    document.addEventListener('paste', event => { const files = [...(event.clipboardData ? event.clipboardData.items : [])].filter(item => item.type.startsWith('image/')).map(item => item.getAsFile()).filter(Boolean); if (files.length) { event.preventDefault(); addFiles(files, targetSlot); } });
    // Clipboard images only: block file drops without importing them.
    document.addEventListener('dragover', event => { if ([...(event.dataTransfer.types || [])].includes('Files')) event.preventDefault(); });
    document.addEventListener('drop', event => { if (event.dataTransfer.files.length) { event.preventDefault(); setStatus('Use Snipping Tool and Ctrl+V to paste screenshots. File uploads and drops are disabled.', true); } });
    document.addEventListener('click', event => { if (!event.target.closest('.image-area, .appendix, #addPageButton')) { targetSlot = null; document.querySelectorAll('.image-area.active').forEach(area => area.classList.remove('active')); } });
    $('printButton').addEventListener('click', () => { if (canExport()) window.print(); });
    $('wordButton').addEventListener('click', () => {
      if (!canExport()) return;
      const url = URL.createObjectURL(new Blob(['\ufeff', buildWord()], { type: 'application/msword' }));
      const link = document.createElement('a'); link.href = url; link.download = 'ODC_PAM_Report_' + ($('reportDate').value || localDate()) + '.doc'; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
    });
    window.addEventListener('beforeprint', syncPrint);
    window.addEventListener('pagehide', save);
    load();
  </script>
</body>
</html>
